name: CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ==========================================================
  # Laravel / Pest / MySQL
  # ==========================================================

  laravel-tests:

    name: Laravel Tests

    runs-on: ubuntu-latest


    services:

      mysql:

        image: mysql:8.4

        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel_test_password
          MYSQL_ROOT_PASSWORD: root_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    env:

      APP_ENV: testing
      APP_DEBUG: false

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_test
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_test_password

      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2

        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, pdo_mysql, zip
          coverage: none


      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction


      - name: Create testing environment
        run: cp .env.example .env


      - name: Generate application key
        run: php artisan key:generate


      - name: Clear Laravel configuration
        run: php artisan config:clear


      - name: Run database migrations
        run: php artisan migrate --force


      - name: Run Pest tests
        run: ./vendor/bin/pest


  # ==========================================================
  # React / TypeScript / Vite
  # ==========================================================

  frontend-tests:

    name: Frontend Tests

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm


      - name: Install NPM dependencies
        run: npm ci


      - name: Run TypeScript check
        run: npm run typecheck


      - name: Build frontend
        run: npm run build


  # ==========================================================
  # Verify PR can merge cleanly into main
  # ==========================================================

  merge-check:

    name: Merge Compatibility

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest


    steps:

      - name: Checkout pull request
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}


      - name: Verify clean merge with main
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"

          git merge \
            --no-commit \
            --no-ff \
            "origin/${{ github.event.pull_request.base.ref }}"
